<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTrack – Accedi</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0f1f3d;
      --blue:   #1a3a6e;
      --accent: #3b82f6;
      --gold:   #e9b84a;
      --light:  #f0f4fb;
      --white:  #ffffff;
      --err:    #ef4444;
      --text:   #1e293b;
      --muted:  #64748b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Sfondo decorativo */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,130,246,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(233,184,74,.12) 0%, transparent 55%);
      pointer-events: none;
    }

    /* Griglia decorativa */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,.97);
      border-radius: 20px;
      width: 420px;
      max-width: 95vw;
      padding: 52px 44px 44px;
      box-shadow: 0 32px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.15);
      animation: slideUp .5s cubic-bezier(.22,.61,.36,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px; height: 60px;
      background: var(--navy);
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(15,31,61,.3);
    }

    .logo-badge svg { width: 32px; height: 32px; }

    .logo-area h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--navy);
      letter-spacing: -.01em;
    }

    .logo-area p {
      font-size: .875rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Messaggio errore */
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4px solid var(--err);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .875rem;
      color: #b91c1c;
      animation: shake .4s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* Form */
    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      color: var(--text);
      background: var(--light);
      transition: border-color .2s, box-shadow .2s, background .2s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(15,31,61,.3);
    }

    .btn-login:hover {
      background: var(--blue);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15,31,61,.35);
    }

    .btn-login:active { transform: translateY(0); }

    .footer-note {
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
      margin-top: 28px;
    }

    .gold-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      margin: 0 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="login-card">

  <div class="logo-area">
    <div class="logo-badge">
      <!-- Icona libro stilizzata -->
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="5" width="11" height="22" rx="2" fill="#3b82f6"/>
        <rect x="17" y="5" width="11" height="22" rx="2" fill="#e9b84a"/>
        <rect x="14" y="5" width="4" height="22" rx="1" fill="white" opacity=".9"/>
      </svg>
    </div>
    <h1>EduTrack</h1>
    <p>Sistema di gestione scolastica</p>
  </div>


  <div class="alert-error" role="alert">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    
  </div>


  <form method="POST" action="{{ url_for('auth.login') }}" novalidate>


    <div class="form-group">
      <label for="username">Nome utente</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="es. mario.rossi"
        value="{{ request.form.get('username', '') }}"
        autocomplete="username"
        required
        autofocus
      >
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      >
    </div>

    <button type="submit" class="btn-login">Accedi</button>

  </form>

  <p class="footer-note">
    Accesso riservato al personale scolastico
    <span class="gold-dot"></span>
    Anno scolastico 2025/26
  </p>

</div>

</body>
</html>
